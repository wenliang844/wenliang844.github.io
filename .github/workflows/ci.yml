name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint:check

      - name: Type-check TypeScript
        run: npm run check:types

      - name: Validate Astro routes
        run: npm run check:astro

      - name: Validate edge Worker bundle
        run: npm run check:worker

      - name: Run tests
        run: npm test

      - name: Evaluate knowledge retrieval and citations
        run: npm run eval:knowledge

      - name: Validate posts
        run: npm run validate:posts

      - name: Build site
        run: npm run build

      - name: Verify committed generated artifacts
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run check:generated

      - name: Scan tracked files for secrets
        run: npm run security:secrets

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run responsive browser tests
        run: npm run test:e2e

      - name: Start Lighthouse preview server
        run: npm run serve -- --port 8139 &

      - name: Run Lighthouse budgets
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

      - name: Validate production readiness
        run: npm run validate:production

      - name: Check coverage
        run: npm run test:coverage

      - name: Audit dependencies
        run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org

  generated-artifacts:
    name: Commit generated build artifacts
    needs: quality
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Commit generated build artifacts
        id: generated-commit
        shell: bash
        run: |
          git add -A -- pagefind/ service-worker.js images/generated/

          if ! git diff --quiet || test -n "$(git ls-files --others --exclude-standard)"; then
            echo "The build changed files outside the generated-artifact allowlist:" >&2
            git status --short >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "Generated build artifacts are already current."
            exit 0
          fi

          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated build artifacts"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Verify generated artifacts are reproducible
        run: npm run check:generated

      - name: Push generated build artifacts
        if: ${{ steps.generated-commit.outputs.created == 'true' }}
        run: git push origin HEAD:master

      - name: Request GitHub Pages build
        if: ${{ steps.generated-commit.outputs.created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
